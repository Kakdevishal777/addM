    <style>
        <style>
      /* =========================================
           PROJECT GALLERY STYLING (UPDATED)
           ========================================= */
        .project-heading {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 2.5rem;
            color: #2c3e50;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .image-gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* This strictly forces 4 columns */
            gap: 1.5rem;
        }

        .gallery-item {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            opacity: 0; 
            transform: translateY(30px);
            cursor: crosshair; 
            height: 220px; /* Added: Forces a smaller, uniform box height */
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        /* =========================================
           BREADCRUMBS
           ========================================= */
       .breadcrumbs {
            background-color: #f4f6f9; 
            padding: 15px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .breadcrumb-container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .breadcrumbs ul {
            list-style: none;
            display: flex;
            align-items: center;
            margin: 0;
            padding: 0;
            font-size: 14px;
            font-family: inherit;
        }

        .breadcrumbs ul li {
            display: inline-flex;
            align-items: center;
            color: #555;
        }

        .breadcrumbs ul li a {
            text-decoration: none;
            color: #0056b3; 
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px; 
        }

        .breadcrumbs ul li a:hover {
            color: #ff6600; 
        }

        .breadcrumbs ul li.separator {
            margin: 0 10px;
            font-size: 12px;
            color: #999;
        }

        .breadcrumbs ul li.active {
            color: #333;
            font-weight: 600;
        }

        /* =========================================
           LIGHTBOX (HOVER TO FULL SCREEN)
           ========================================= */
        .lightbox {
            display: none; 
            position: fixed;
            z-index: 9999; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); 
            align-items: center;
            justify-content: center;
            pointer-events: none; 
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            animation: popIn 0.2s ease-out; 
        }

        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Adds space between the image gallery and the footer */
.container {
    margin-bottom: 80px; /* You can increase or decrease this number to adjust the space */
}



        /* =========================================
           FIXED BUTTONS
           ========================================= */
        .fixed-buttons .btn-circle {
            width: 50px;
            height: 50px;
            color: white;
            border-radius: 50%;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            line-height: 1;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .whatsapp-btn {
            background-color: #25D366;
        }

        .whatsapp-btn:hover {
            background-color: #1ebe5b;
        }

        .scroll-top-btn1 {
            background-color: #ff6600;
        }

        .scroll-top-btn1:hover {
            background-color: #0090f7;
        }

        @media (max-width: 480px) {
            .fixed-buttons .btn-circle {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
        @media (max-width: 768px) {
            .image-gallery {
                grid-template-columns: repeat(2, 1fr); /* Changes to 2 columns on mobile */
            }
        }
    </style>

<body>
    <header id="header"></header>

    <div class="breadcrumbs">
        <div class="breadcrumb-container" id="dynamic-breadcrumbs">
            </div>
    </div>

    <div class="container">

        <div class="image-gallery">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="assets/script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // GSAP Animations
            gsap.from(".project-heading", {
                y: -50,
                opacity: 0,
                duration: 1,
                ease: "power3.out"
            });

            gsap.to(".gallery-item", {
                y: 0,
                opacity: 1,
                duration: 0.8,
                stagger: 0.1, 
                ease: "power2.out",
                delay: 0.3 
            });

            // =========================================
            // LIGHTBOX HOVER LOGIC
            // =========================================
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const galleryItems = document.querySelectorAll('.gallery-item');

            galleryItems.forEach(item => {
                const img = item.querySelector('img');

                // Trigger full screen when mouse enters the thumbnail
                item.addEventListener('mouseenter', () => {
                    lightbox.style.display = 'flex'; 
                    lightboxImg.src = img.src;       
                });

                // Hide full screen when mouse leaves the thumbnail
                item.addEventListener('mouseleave', () => {
                    lightbox.style.display = 'none';
                });
            });
        });
    </script>
